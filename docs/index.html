<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9e8"><title>Lemon MiniGames · 柠檬小游戏</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#fff2b2,transparent 35%),linear-gradient(135deg,#f8fbef,#e4f0e3);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#344c35;min-height:100dvh}.wrap{max-width:1100px;margin:auto;padding:24px 18px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:clamp(24px,4vw,36px)}.hint{color:#71806d;margin:8px 0 24px}.btn{background:white;border:1px solid #dce5d5;border-radius:14px;padding:11px 18px;font-weight:700;color:#3c5b3c;cursor:pointer}.btn:focus-visible,.tile:focus-visible{outline:3px solid #ffb84a}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile{border:0;text-align:left;cursor:pointer;padding:32px;border-radius:24px;box-shadow:0 15px 35px #35553318;min-height:240px;transition:transform .2s}.tile:hover{transform:translateY(-4px)}.tile:first-child{background:linear-gradient(140deg,#ffe6a0,#ffce68)}.tile:last-child{background:linear-gradient(140deg,#d3efc2,#9bcea4)}.tile .emoji{font-size:55px}.tile strong{display:block;font-size:26px;margin:12px 0}.tile small{font-size:15px;color:#50604c}.game-area{display:none;align-items:center;flex-direction:column;gap:12px}.game-area.active{display:flex}.game-bar{display:flex;width:min(100%,460px);justify-content:space-between;align-items:center}.game-title{font-size:19px;font-weight:800}.frame{width:min(100%,460px);border-radius:20px;overflow:hidden;box-shadow:0 16px 55px #27402b30;background:#fff9e8}canvas{width:100%;display:block;touch-action:none}footer{margin-top:32px;text-align:center;color:#71806d;font-size:13px}@media(max-width:650px){.tiles{grid-template-columns:1fr}.tile{min-height:185px;padding:22px}.wrap{padding-top:18px}}
</style></head><body><main class="wrap"><header><h1>🍋 Lemon MiniGames</h1><button class="btn" id="homeTop" hidden>返回大厅</button></header><p class="hint" id="intro">随时开玩 · 无需安装 · 支持手机触摸和电脑鼠标</p><section class="tiles" id="tiles"><button class="tile" data-game="match"><span class="emoji">🍋</span><strong>柠檬大消除</strong><small>滑动交换 · 连击得分 · 10 关挑战 →</small></button><button class="tile" data-game="tower"><span class="emoji">🏰</span><strong>柠檬塔防</strong><small>三种防御塔 · 波次敌人 · 策略守卫 →</small></button></section><section class="game-area" id="gameArea"><div class="game-bar"><span class="game-title" id="gameTitle"></span><button class="btn" id="restart">重新开始</button></div><div class="frame"><canvas id="game" aria-label="小游戏画布"></canvas></div><div class="hint" id="instructions"></div></section><footer>纯静态网页 · 无需登录 · 游戏在本地运行</footer></main><script type="module" src="./app.js"></script></body></html>
