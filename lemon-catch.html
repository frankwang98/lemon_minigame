<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e8"><title>柠檬抓抓乐</title><link rel="stylesheet" href="./h5-theme.css"><style>
*{box-sizing:border-box}body{margin:0}.wrap{max-width:540px;margin:0 auto;padding:14px 12px 36px}.game{background:#1b3029;border:1px solid #41644e;border-radius:20px;padding:14px;color:#f5f8ed}.controls{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.controls .audio{display:flex;gap:6px}.game button{font-family:inherit;cursor:pointer;touch-action:manipulation}.tool{background:#2e5543;border:1px solid #62866c;color:#f3f8ec;border-radius:10px;padding:9px;font-size:12px;font-weight:700}.tool:disabled{opacity:.35;cursor:default}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{background:#284637;border-radius:10px;text-align:center;padding:8px 2px}.stat small{display:block;font-size:11px;color:#b6d1bf}.stat strong{font-size:19px}.progress{height:8px;border-radius:8px;background:#10251b;margin-bottom:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#76d29a,#f6d785);transition:width .15s}.board{height:clamp(320px,82vw,430px);position:relative;border:3px solid #719675;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#739561,#416e4b 62%,#204b38);touch-action:manipulation}.board:before{content:"";position:absolute;inset:14px;border:2px dashed #c2d9a944;border-radius:48%;pointer-events:none}.piece{position:absolute;width:16%;height:16%;padding:0;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#fffce9,#e7d5b0);border:2px solid #fff8e1;box-shadow:0 4px 0 #bca27a,0 8px 12px #0b211a77;font-size:clamp(23px,7vw,35px);transform:translate(-50%,-50%) rotate(var(--angle));transition:filter .1s}.piece:active:not(:disabled){filter:brightness(1.2)}.piece.covered{filter:brightness(.58) saturate(.7);cursor:not-allowed}.piece.hint{outline:4px solid #ffe18b}.tray-head{display:flex;justify-content:space-between;margin:15px 0 8px;font-size:14px;font-weight:700}.tray{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.slot{aspect-ratio:1;border:1px solid #628973;border-radius:9px;background:#102a20;display:grid;place-items:center;font-size:clamp(19px,5vw,29px)}.slot.filled{background:#f1e4c0}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.message{text-align:center;min-height:22px;margin-top:12px;font-size:13px;color:#f1d79b}.hintline{text-align:center;font-size:12px;color:#a8c7b0;line-height:1.7;margin:10px 0 0}.modal{position:absolute;inset:0;z-index:100;background:#081d16e8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:18px}.modal[hidden]{display:none!important}.modal strong{font-size:26px}.float{position:absolute;pointer-events:none;font-size:22px;font-weight:900;color:#ffe38a;animation:rise .5s ease-out forwards;z-index:70}@keyframes rise{to{opacity:0;transform:translateY(-45px) scale(1.3)}}@media(max-width:380px){.tool{font-size:11px;padding:8px 5px}.controls{flex-wrap:wrap}}
</style><style>
body.catch-light{background:radial-gradient(circle at 10% 5%,#ffedb0 0,transparent 38%),linear-gradient(155deg,#fffaf0,#eaf5df 75%)!important;color:#2e513a!important;min-height:100dvh}
.catch-light .hall-heading{color:#2c563d}
.catch-light .hall-back{background:#fffdf4;color:#30553d;border:1px solid #d3e5c8}
.catch-light .game.hall-game{background:linear-gradient(165deg,#fffdf4,#f4fae9)!important;border:1px solid #d4e8c5;box-shadow:0 12px 32px #607e461c;color:#30513b}
.catch-light .tool{background:#fffdf3;color:#376044;border:1px solid #c6dfb8;box-shadow:0 2px 0 #d9e8ce}
.catch-light .tool:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.catch-light .stat{background:#e9f5dd;color:#31563d}
.catch-light .stat small{color:#6b856c}
.catch-light .progress{background:#e1ecd8}
.catch-light .board{border-color:#c6dfab;background:radial-gradient(ellipse at 50% 40%,#c5e8a5,#a3d68b 65%,#7cba79)}
.catch-light .board:before{border-color:#fff8e599}
.catch-light .piece.covered{filter:brightness(.83) saturate(.8);opacity:.88}
.catch-light .tray-head{color:#345b40}
.catch-light .slot{background:#e8f3de;border-color:#bfd8af}
.catch-light .slot.filled{background:#fff1c7}
.catch-light .message{color:#9a7228}
.catch-light .hintline{color:#69836a}
.catch-light .modal{background:#f7fbeaef;color:#31553d}
.catch-light .modal #summary{color:#67836a}
</style></head><body class="catch-light"><nav class="hall-nav"><h1 class="hall-heading">🍋 柠檬小游戏厅</h1><a class="hall-back" data-hall-back href="./">返回大厅 ↩</a></nav><main class="wrap"><section class="game hall-game">
<div class="controls"><strong>🪿 柠檬抓抓乐</strong><div class="audio"><button class="tool" data-hall-music aria-pressed="false">🎵 音乐：关</button><button class="tool" id="sound" aria-pressed="true">🔊 音效：开</button></div></div>
<div class="stats"><div class="stat"><small>关卡</small><strong id="level">1</strong></div><div class="stat"><small>剩余</small><strong id="left">0</strong></div><div class="stat"><small>得分</small><strong id="score">0</strong></div><div class="stat"><small>时间</small><strong id="time">03:00</strong></div></div><div class="progress"><div id="progress"></div></div>
<div class="board" id="board"><div id="pieces"></div><div id="modal" class="modal" hidden><strong id="result"></strong><span id="summary"></span><button class="tool" id="next" style="background:#f4d88d;color:#29422f;padding:13px 25px;font-size:16px">继续</button></div></div>
<div class="tray-head"><span>🧺 收集槽</span><span id="count">0 / 7</span></div><div class="tray" id="tray"></div>
<div class="tools"><button class="tool" id="undo">↶ 撤回 ×<span id="un">3</span></button><button class="tool" id="mix">🥘 颠锅 ×<span id="mn">2</span></button><button class="tool" id="hint">💡 提示 ×<span id="hn">3</span></button></div><div class="tools" style="grid-template-columns:1fr"><button class="tool" id="reset">↻ 重新开始</button></div><div id="msg" class="message">点击亮色物品，翻出下一层！</div><p class="hintline">亮色可拿 · 暗色被压住 · 三个相同自动消除<br>收集槽最多 7 格，点击立即响应</p>
</section></main><script src="./h5-music.js"></script><script src="./h5-swipe.js"></script><script src="./lemon-catch.js"></script></body></html>
