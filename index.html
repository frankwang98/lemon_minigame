<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#fff2b2,transparent 35%),linear-gradient(135deg,#f8fbef,#e4f0e3);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#f3f9f2;min-height:100dvh}.wrap{max-width:1100px;margin:auto;padding:24px 18px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:clamp(24px,4vw,36px)}.hint{color:#a8c8b4;margin:8px 0 24px}.btn{background:white;border:1px solid #dce5d5;border-radius:14px;padding:11px 18px;font-weight:700;color:#3c5b3c;cursor:pointer}.btn:focus-visible,.tile:focus-visible{outline:3px solid #ffb84a}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile{border:0;text-align:left;cursor:pointer;padding:32px;border-radius:24px;box-shadow:0 15px 35px #35553318;min-height:240px;transition:transform .2s}.tile:hover{transform:translateY(-4px)}.tile:first-child{background:linear-gradient(140deg,#315e45,#264a39)}.tile:nth-child(2){background:linear-gradient(140deg,#3a594a,#274337)}.tile:nth-child(3){background:linear-gradient(140deg,#4b6442,#2a4935)}.tile .emoji{font-size:55px}.tile strong{display:block;font-size:26px;margin:12px 0}.tile small{font-size:15px;color:#b9d4c2}.game-area{display:none;align-items:center;flex-direction:column;gap:12px}.game-area.active{display:flex}.game-bar{display:flex;width:min(100%,460px);justify-content:space-between;align-items:center}.game-title{font-size:19px;font-weight:800}.game-bar{gap:7px;flex-wrap:wrap}.game-bar #matchSound{font-size:12px;padding:8px 10px}.frame{width:min(100%,460px);border-radius:20px;overflow:hidden;box-shadow:0 16px 55px #27402b30;background:#1b3029}canvas{width:100%;display:block;touch-action:none}footer{margin-top:32px;text-align:center;color:#a8c8b4;font-size:13px}@media(max-width:650px){.tiles{grid-template-columns:1fr}.tile{min-height:185px;padding:22px}.wrap{padding-top:18px}}
