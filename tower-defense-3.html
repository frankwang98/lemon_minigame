<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>塔防 3.0 · 柠檬小游戏厅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101d1b;color:#f0f5f1;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif}.game{max-width:490px;margin:18px auto;padding:16px;background:#1a2a27;border-radius:18px;display:flex;flex-direction:column;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.stat{background:#263c35;border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;color:#adc4b9}.stat b{display:block;font-size:20px;color:#fff}canvas{display:block;width:100%;height:auto;border-radius:11px;touch-action:manipulation;background:#172b28}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}button{background:#31443d;color:white;border:1px solid #486256;border-radius:9px;padding:10px 5px;font-size:12px;font-weight:600;cursor:pointer}button.sel{outline:2px solid #e46c56}button.main{background:#aa3c37;border-color:#aa3c37;font-size:14px;flex:1}button:disabled{opacity:.4}.small{font-size:10px;font-weight:400;color:#b5c9bf}.controls{display:flex;gap:7px}.msg{text-align:center;background:#263c35;border-radius:9px;padding:10px;min-height:40px}.legend{font-size:11px;color:#b5c9bf;line-height:1.8}h1{font-size:20px;margin:0;text-align:center}
a.back{display:block;max-width:490px;margin:12px auto 0;padding:0 16px;color:#b8e8d0;text-decoration:none;font-size:14px}a.back:hover{text-decoration:underline}
.sound-switch{text-align:right}.sound-switch button{font-size:12px;padding:7px 12px;background:#38584a;border-color:#668b77}</style><style>
.tower-light .game.hall-game{background:linear-gradient(165deg,#fffdf4,#f1f8e8)!important;border:1px solid #d4e8c5;box-shadow:0 12px 32px #607e461c;color:#31543d}
.tower-light .stat,.tower-light .msg{background:#e9f5dd;color:#638269}
.tower-light .stat b{color:#31543d}
.tower-light .tools button,.tower-light .controls button:not(.main),.tower-light .sound-switch button{background:#fffdf4;border:1px solid #c7dfb9;color:#345b40}
.tower-light .tools button.sel{outline:2px solid #e5a64e;background:#fff0cc}
.tower-light .controls button.main{background:#e8a348;border-color:#e8a348;color:#372f1c}
.tower-light .small,.tower-light .legend{color:#68826d}
.tower-light canvas{background:#a7d28b;border:2px solid #c4dda9}
</style><link rel="stylesheet" href="./h5-theme.css"></head><body class="tower-light"><nav class="hall-nav"><h1 class="hall-heading">🍋 柠檬小游戏厅</h1><a class="hall-back" data-hall-back href="./">返回大厅 ↩</a></nav><main class="game hall-game" id="hellTD"><div class="sound-switch hall-audio"><button type="button" data-hall-music aria-pressed="false">🎵 音乐：关</button><button type="button" id="xSound" aria-pressed="true">🔊 音效：开</button></div>
<div class="stats"><div class="stat">金币<b id="xGold">145</b></div><div class="stat">生命<b id="xLife">8</b></div><div class="stat">波次<b id="xWave">0/15</b></div><div class="stat">击杀<b id="xKills">0</b></div></div>
<canvas id="xCanvas" width="400" height="400" aria-label="塔防地图"></canvas>
<div class="tools"><button data-mode="gun" class="sel">🔵 速射塔<div class="small">65 金币</div></button><button data-mode="cannon">🟠 火炮塔<div class="small">125 金币</div></button><button data-mode="ice">❄️ 冰冻塔<div class="small">105 金币</div></button><button data-mode="laser">🟣 穿甲塔<div class="small">155 金币</div></button><button data-mode="upgrade">⬆️ 升级<div class="small">最多 3 级</div></button><button data-mode="sell">💰 出售<div class="small">返还 45%</div></button></div>
<div class="controls"><button class="main" id="xStart">▶ 开始第 1 波</button><button id="xSpeed">×1 速度</button><button id="xReset">↻ 重开</button></div>
<div id="xMsg" class="msg" aria-live="polite">所有空白草地都可以建塔，道路和已有炮塔除外。</div><div class="legend">🟡 疾跑：移动快　🟣 装甲：减伤　🔷 护盾：吸收伤害　🟢 医疗：恢复周围敌人生命　👑 Boss：召唤小怪</div></main><script src="./h5-music.js"></script><script src="./h5-swipe.js"></script>
<script>
(function(){
const root=document.getElementById('hellTD'),q=s=>root.querySelector(s),cv=q('#xCanvas'),c=cv.getContext('2d'),S=40;
const paths=[[[0,2],[1,2],[2,2],[3,2],[3,3],[3,4],[4,4],[5,4],[5,5],[6,5],[7,5],[7,6],[8,6],[9,6]],[[0,8],[1,8],[2,8],[2,7],[2,6],[3,6],[4,6],[5,6],[5,5],[6,5],[7,5],[7,6],[8,6],[9,6]]];
const slots=[[1,1],[3,1],[5,2],[4,3],[2,4],[4,5],[6,3],[7,4],[8,4],[1,6],[3,7],[5,7],[6,7],[8,8]];
const roadSet=new Set(paths.flat().map(p=>p.join(',')));
const config={gun:{cost:65,range:100,dmg:17,rate:.25,color:'#42b5ff'},cannon:{cost:125,range:118,dmg:62,rate:1.3,color:'#ffac50'},ice:{cost:105,range:100,dmg:9,rate:.65,color:'#8ee9ff'},laser:{cost:155,range:132,dmg:44,rate:.72,color:'#c58cff'}};
let gold,life,wave,kills,towers,enemies,shots,mode,active,ended,spawned,clock,speed,last,uid,bossSpawn;
let soundEnabled=true,soundContext=null,lastShotSound=0;
function unlockSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;soundContext??=new C();if(soundContext.state==='suspended')soundContext.resume().catch(()=>{});return soundContext}catch(e){return null}}
function sound(freq=440,duration=.08,volume=.075){if(!soundEnabled)return;const ac=unlockSound();if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+.015;o.type='triangle';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(Math.max(volume,.001),t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}
q('#xSound').onclick=()=>{soundEnabled=!soundEnabled;q('#xSound').textContent=soundEnabled?'🔊 音效：开':'🔇 音效：关';q('#xSound').setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled)sound(620,.14,.09)};
root.addEventListener('pointerdown',unlockSound,{passive:true});
const msg=s=>q('#xMsg').textContent=s;
function sync(){q('#xGold').textContent=gold;q('#xLife').textContent=life;q('#xWave').textContent=wave+'/15';q('#xKills').textContent=kills;q('#xStart').disabled=active||ended||wave>=15}
function choose(m){mode=m;root.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('sel',b.dataset.mode===m))}
function reset(){gold=145;life=8;wave=0;kills=0;towers=[];enemies=[];shots=[];mode='gun';active=false;ended=false;spawned=0;clock=0;speed=1;last=0;uid=0;bossSpawn=0;q('#xSpeed').textContent='×1 速度';q('#xStart').textContent='▶ 开始第 1 波';msg('所有空白草地都可以建塔，道路和已有炮塔除外。');choose('gun');sync()}
function pos(e){let path=paths[e.lane],i=Math.min(Math.floor(e.p),path.length-2),f=Math.min(1,e.p-i),a=path[i],b=path[i+1];return{x:(a[0]+(b[0]-a[0])*f+.5)*S,y:(a[1]+(b[1]-a[1])*f+.5)*S}}
function total(){return 7+wave*2}
function spawn(type,lane,p=0){let mult=Math.pow(1.27,wave-1),hp={normal:65,fast:43,armor:170,shield:100,medic:90,boss:900}[type]*mult;enemies.push({id:++uid,type,lane,p,hp,max:hp,shield:type==='shield'?hp*.9:0,v:{normal:.7,fast:1.35,armor:.42,shield:.68,medic:.58,boss:.32}[type],reward:{normal:12,fast:16,armor:24,shield:19,medic:25,boss:120}[type],slow:0,heal:0,summon:0})}
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));
q('#xSpeed').onclick=()=>{speed=speed===1?2:speed===2?3:1;q('#xSpeed').textContent='×'+speed+' 速度'};
q('#xReset').onclick=reset;
q('#xStart').onclick=()=>{if(active||ended||wave>=15)return;wave++;active=true;sound(540,.16,.08);spawned=0;clock=0;q('#xStart').textContent='⚔️ 进攻中';msg(wave%5===0?'⚠️ Boss 入侵！':'第 '+wave+' 波：双路进攻');sync()};
cv.addEventListener('pointerdown',ev=>{if(ended)return;let r=cv.getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)*400/r.width/40),y=Math.floor((ev.clientY-r.top)*400/r.height/40);let t=towers.find(t=>t.x===x&&t.y===y);if(mode==='upgrade'){if(!t){msg('请选择已有炮塔');return}if(t.level===3){msg('已达到最高等级');return}let cost=65+t.level*65;if(gold<cost){msg('升级需要 '+cost+' 金币');return}gold-=cost;t.spent+=cost;t.level++;sound(730,.15,.07);msg('升级成功，Lv.'+t.level)}else if(mode==='sell'){if(!t){msg('这里没有炮塔');return}let amount=Math.floor(t.spent*.45);gold+=amount;towers=towers.filter(v=>v!==t);sound(340,.12,.06);msg('出售获得 '+amount+' 金币')}else{if(x<0||x>=10||y<0||y>=10||roadSet.has(x+','+y)){msg('道路上不能建塔，请选择空白草地！');return}if(t){msg('位置已占用');return}let cost=config[mode].cost;if(gold<cost){msg('金币不足，需要 '+cost);return}gold-=cost;towers.push({x,y,type:mode,level:1,spent:cost,cool:0});sound(580,.11,.07);msg('建造成功')}sync()});
function hit(e,d,t){if(e.type==='armor'&&t.type!=='laser')d*=.32;if(e.type==='boss'&&t.type!=='laser')d*=.7;if(e.shield>0){let used=Math.min(e.shield,d);e.shield-=used;d-=used}e.hp-=d;if(t.type==='ice')e.slow=Math.max(e.slow,1.8)}
function update(dt){if(!active)return;clock-=dt;if(spawned<total()&&clock<=0){let n=spawned,type=n%9===8?'medic':n%6===5?'shield':n%5===3?'armor':n%3===1?'fast':'normal';if(wave%5===0&&n===total()-1)type='boss';spawn(type,n%2);spawned++;clock=Math.max(.24,.7-wave*.019)}
for(let e of enemies){e.slow=Math.max(0,e.slow-dt);e.p+=e.v*(e.slow>0?.48:1)*dt;if(e.type==='medic'){e.heal+=dt;if(e.heal>=1.4){e.heal=0;let ep=pos(e);for(let other of enemies){let op=pos(other);if(Math.hypot(op.x-ep.x,op.y-ep.y)<95)other.hp=Math.min(other.max,other.hp+other.max*.075)}}}if(e.type==='boss'){e.summon+=dt;if(e.summon>=3.8){e.summon=0;bossSpawn++;if(bossSpawn<15)spawn('fast',e.lane,Math.max(0,e.p-.65))}}}
for(let t of towers){t.cool-=dt;if(t.cool>0)continue;let cfg=config[t.type],cx=(t.x+.5)*S,cy=(t.y+.5)*S,r=cfg.range+(t.level-1)*12;let candidates=enemies.filter(e=>{let p=pos(e);return Math.hypot(p.x-cx,p.y-cy)<r}).sort((a,b)=>b.p-a.p);if(!candidates.length)continue;let e=candidates[0],p=pos(e),d=cfg.dmg*Math.pow(1.65,t.level-1);hit(e,d,t);if(t.type==='cannon')for(let other of enemies){if(other!==e){let op=pos(other);if(Math.hypot(op.x-p.x,op.y-p.y)<45)hit(other,d*.48,t)}}t.cool=cfg.rate/(1+(t.level-1)*.22);if(performance.now()-lastShotSound>160){sound(t.type==='cannon'?150:390,.055,.035);lastShotSound=performance.now()}shots.push({x:cx,y:cy,tx:p.x,ty:p.y,ttl:.14,type:t.type})}
shots=shots.filter(s=>(s.ttl-=dt)>0);
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.hp<=0){gold+=e.reward;kills++;enemies.splice(i,1)}else if(e.p>=paths[e.lane].length-1){life-=e.type==='boss'?5:e.type==='armor'?2:1;enemies.splice(i,1)}}
if(life<=0){life=0;active=false;ended=true;q('#xStart').textContent='失败';sound(150,.4,.09);msg('💀 基地失守！最终到达第 '+wave+' 波。')}
else if(spawned>=total()&&enemies.length===0){active=false;if(wave===15){ended=true;q('#xStart').textContent='🏆 胜利';sound(880,.35,.09);msg('🏆 全部 15 波通关！你守住了基地！')}else{gold+=20;q('#xStart').textContent='▶ 开始第 '+(wave+1)+' 波';msg('守住第 '+wave+' 波，奖励 20 金币。')}}sync()}
function draw(){c.clearRect(0,0,400,400);let road=roadSet;for(let y=0;y<10;y++)for(let x=0;x<10;x++){c.fillStyle=road.has(x+','+y)?'#877b68':(x+y)%2?'#a5d18a':'#b5db99';c.fillRect(x*S,y*S,S,S);c.strokeStyle='rgba(255,255,255,.045)';c.strokeRect(x*S+.5,y*S+.5,39,39)}
for(let lane=0;lane<2;lane++){c.strokeStyle=lane?'#f3c885':'#d8b5a6';c.lineWidth=2;c.setLineDash([4,7]);c.beginPath();paths[lane].forEach((p,i)=>{let x=(p[0]+.5)*S,y=(p[1]+.5)*S;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.setLineDash([])}
for(let y=0;y<10;y++)for(let x=0;x<10;x++){if(roadSet.has(x+','+y)||towers.some(t=>t.x===x&&t.y===y))continue;c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.arc((x+.5)*S,(y+.5)*S,2,0,Math.PI*2);c.fill()}
c.font='18px sans-serif';c.fillText('🚩',1,74);c.fillText('🚩',1,314);c.fillText('🏠',365,234);
for(let t of towers){let x=(t.x+.5)*S,y=(t.y+.5)*S;c.fillStyle='#10272d';c.beginPath();c.arc(x,y,17,0,7);c.fill();c.fillStyle=config[t.type].color;c.beginPath();c.arc(x,y,12,0,7);c.fill();c.fillStyle='#152c34';c.fillRect(x-3,y-17,6,14);c.fillStyle='white';c.font='bold 11px sans-serif';c.textAlign='center';c.fillText(t.level,x,y+4);c.textAlign='left'}
for(let e of enemies){let p=pos(e),rad=e.type==='boss'?17:e.type==='armor'?13:10;c.fillStyle={normal:'#ef6c76',fast:'#f4d45e',armor:'#b68cf4',shield:'#60bafa',medic:'#65d894',boss:'#fa649d'}[e.type];c.beginPath();c.arc(p.x,p.y,rad,0,7);c.fill();if(e.shield>0){c.strokeStyle='#92ddff';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,rad+4,0,7);c.stroke()}if(e.slow>0){c.strokeStyle='#b0f7ff';c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,rad+6,0,7);c.stroke()}if(e.type==='boss'){c.font='16px sans-serif';c.fillText('👑',p.x-9,p.y-16)}c.fillStyle='#502d38';c.fillRect(p.x-14,p.y-rad-9,28,4);c.fillStyle='#70f4a4';c.fillRect(p.x-14,p.y-rad-9,28*Math.max(0,e.hp/e.max),4)}
for(let s of shots){c.globalAlpha=Math.min(1,s.ttl/.14);c.strokeStyle=config[s.type].color;c.lineWidth=s.type==='cannon'?6:3;c.beginPath();c.moveTo(s.x,s.y);c.lineTo(s.tx,s.ty);c.stroke();c.globalAlpha=1}}
function frame(ts){let dt=last?Math.min((ts-last)/1000,.05):0;last=ts;if(active)for(let i=0;i<speed;i++)update(dt);draw();requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
})();
</script></body></html>
